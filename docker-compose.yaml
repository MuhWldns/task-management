version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ticketing_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ticketing_net

volumes:
  pgdata:

networks:
  ticketing_net:
    driver: bridge
